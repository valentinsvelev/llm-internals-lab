name: Deploy Website

on:
  push:
    branches: [main]
  workflow_dispatch:

# Read-only by default. Only deployment needs elevated permissions.
permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    name: Publish to GitHub Pages
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v6

      - name: Assemble the site (the explorer is one self-contained page)
        run: |
          mkdir -p _site
          cp src/llm_lab/assets/explorer.html _site/index.html

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload site
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      - name: Deploy site
        id: deployment
        uses: actions/deploy-pages@v5