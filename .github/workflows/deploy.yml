name: LLM Internals Lab CI/CD

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

# Read-only by default. Only deployment needs elevated permissions.
permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint and test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dependencies (CPU-only PyTorch)
        run: |
          python -m pip install --upgrade pip
          pip install --index-url https://download.pytorch.org/whl/cpu 'torch>=2.5,<3'
          pip install -e '.[dev]'

      - name: Install Playwright browser
        run: python -m playwright install --with-deps chromium

      - name: Lint
        run: ruff check src tests

      - name: Run tests (explorer, browser, PyTorch reference vs transformers)
        run: python -m pytest

  deploy:
    name: Publish to GitHub Pages
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v6

      - name: Assemble the site (the explorer is one self-contained page)
        run: |
          mkdir -p _site
          cp src/llm_lab/assets/explorer.html _site/index.html

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload site
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      - name: Deploy site
        id: deployment
        uses: actions/deploy-pages@v5
